[project]
name = "yoga-assistant-knowledge-rag"
version = "0.1.0"
description = "A RAG system for yoga knowledge with retrieval-augmented generation"
authors = [
    {name = "Ramsi Kalia", email = "ramsi@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.54.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.1.0",
    "numpy>=2.0.0",
    "rank-bm25>=0.2.2",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yoga-assistant"]

[tool.uv]
dev-dependencies = []
